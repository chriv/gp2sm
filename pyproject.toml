[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gp2sm"
dynamic = ["version"]
description = "Move a Google Photos library (via Google Takeout) into SmugMug and keep it organized: planned, verified, undoable."
readme = "README.md"
license = "Unlicense"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["smugmug", "google-photos", "google-takeout", "photos", "migration", "backup", "live-photos"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Graphics",
  "Topic :: System :: Archiving :: Backup",
]
dependencies = [
  "requests>=2.28",
  "requests-oauthlib>=1.3",
  "Pillow>=10.0",
  "piexif>=1.1",
  "pillow-heif>=0.18",
  "tomli>=2; python_version < '3.11'",
  "tzdata; sys_platform == 'win32'",  # Windows has no system IANA time zone database for zoneinfo
]

[project.urls]
Homepage = "https://github.com/chriv/gp2sm"
Documentation = "https://github.com/chriv/gp2sm#readme"
Issues = "https://github.com/chriv/gp2sm/issues"
Changelog = "https://github.com/chriv/gp2sm/blob/v2/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5", "build>=1"]

[project.scripts]
gp2sm = "gp2sm.cli:main"

[project.entry-points."gp2sm.services"]
smugmug = "gp2sm.smugmug:service"
google-takeout = "gp2sm.takeout:service"

[tool.setuptools.dynamic]
version = { attr = "gp2sm.__version__" }

[tool.setuptools.packages.find]
include = ["gp2sm*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E501"]  # long SQL strings and log messages are clearer unwrapped

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: talks to a real service; opt-in via environment variables (see tests/test_destination_contract.py)"]
