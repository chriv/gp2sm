[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gp2sm"
dynamic = ["version"]
description = "Move photo libraries into SmugMug (Google Takeout import, consolidation, dating) with state tracking and server-side verification."
readme = "README.md"
license = { text = "Unlicense" }
requires-python = ">=3.10"
dependencies = [
  "requests>=2.28",
  "requests-oauthlib>=1.3",
  "Pillow>=10.0",
  "piexif>=1.1",
  "pillow-heif>=0.18",
  "tzdata; sys_platform == 'win32'",  # Windows has no system IANA time zone database for zoneinfo
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
gp2sm = "gp2sm.cli:main"

[project.entry-points."gp2sm.services"]
smugmug = "gp2sm.smugmug:service"
google-takeout = "gp2sm.takeout:service"

[tool.setuptools.dynamic]
version = { attr = "gp2sm.__version__" }

[tool.setuptools.packages.find]
include = ["gp2sm*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E501"]  # long SQL strings and log messages are clearer unwrapped

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: talks to a real service; opt-in via environment variables (see tests/test_destination_contract.py)"]
