# Example: import a Google Takeout export into dated month albums on SmugMug.
# Put the Takeout .tgz files in takeout/, then: gp2sm takeout-index, takeout-match, takeout-upload plan/stage/upload.
# gp2sm project configuration. Paths are relative to this folder.
# Reference: every key, its meaning and default, is listed below.

# --- General
[project]
# a name for this project (shown in reports)
name = "Family photos"
# time zone for capture dates and month albums, e.g. America/New_York
timezone = "America/Chicago"

# --- Where items go
[destination]
# destination service (see `gp2sm services`)
service = "smugmug"
# name of the stored credentials (see `gp2sm auth`)
credentials = "smugmug"
# folder that holds this project's albums
folder = "Family Photos"

# --- Album names and limits
[albums]
# dated album name; {yyyy} and {mm} come from the capture date, {group} from [[organize.group]]
photo = "Photos {yyyy}-{mm}"
# dated album for videos (same as photo keeps them together)
video = "Photos {yyyy}-{mm}"
# album for photos with no confident date
undated_photo = "Photos Undated"
# album for videos with no confident date
undated_video = "Videos Undated"
# album for byte-identical extra copies (moved, not deleted)
duplicates = "Duplicates (review)"
# split an album into '- Part N' above this many items
soft_cap = 4000
# never put more than this many items in one album
hard_cap = 5000

# --- Reorganizing existing albums (`gp2sm consolidate`)
[consolidate]
# substrings of album paths to consolidate from
sources = []
# optional legacy transfer databases (Google item lists) for dating
legacy_dbs = []

# --- Google Takeout import
[takeout]
# folder with the Google Takeout archives (.zip or .tgz)
archives = "takeout"
# Takeout index database
index = "takeout_index.db"
# HEIC photos: convert to JPEG here (EXIF kept) or upload as is (the destination may convert)
heic = "convert"
# Live Photo motion clips: pair (same name, next to the still), separate (video albums), skip
live_clips = "pair"
# clips with no matching still: dated video album by their own time, the undated album, or skip
unpaired_clips = "dated"
# photos in formats the destination rejects (e.g. WebP, BMP): convert to JPEG, or skip
rejected_types = "convert"
# skip items already on the destination: exact (same bytes), content (also same picture), off
dedupe = "content"
# folders or albums (by name, e.g. "Family/2023-05") to check for existing copies; empty = this project's folder, ["/"] = the whole account
existing = []
# content check: picture distance at or below this is the same photo
same_max = 6
# content check: distance at or above this is a different photo; between = review
different_min = 19
# a clip pairs with a still taken within this many seconds
pair_window = 60
# a clip pairs only with a still of the same shape, within this percent
aspect_tolerance_pct = 2

# --- organize
[organize]
# folders or albums (by name) whose items are organized, e.g. ["Uploads"]
sources = []
# where capture dates come from, in order: camera (the file's own date), filename, upload (last resort), legacy (old transfer DBs)
dates = ["camera", "filename"]
# move items into the dated albums, or collect them (copies stay in the source; use for albums an uploader app still writes to)
mode = "move"
# leave items uploaded within this many days alone (0 = none)
skip_newer_than_days = 0
# byte-identical extra copies: park in the duplicates album, or keep where they are
duplicates = "park"
# group name for items no [[organize.group]] rule matches
unassigned = "Unassigned"
# ordered rules naming a group, e.g. [[organize.group]] name = "Phone" model = "iPhone*" (also: album, make, filename; case-insensitive globs)
group = []

# --- Performance
[run]
# items per batch move
move_batch_size = 25
# parallel network workers
workers = 8
