name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: ruff check gp2sm tests

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: gp2sm --version

  package:
    # build the wheel and use it from a clean environment, as a user would install it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - run: python -m venv /tmp/clean && /tmp/clean/bin/pip install dist/*.whl
      - run: |
          cd /tmp
          /tmp/clean/bin/gp2sm --version
          /tmp/clean/bin/gp2sm --help
          /tmp/clean/bin/gp2sm init /tmp/demo --non-interactive --name demo --timezone UTC
          test -f /tmp/demo/gp2sm.toml
          /tmp/clean/bin/gp2sm services
