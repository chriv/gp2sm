name: CI

# Pushes and pull requests run a slim matrix; a version tag (v*) runs every Python on Linux and Windows.
# No macOS runners (they bill at 10x): run scripts/test-pythons.sh on a Mac before pushing or tagging.
# Changes that touch only documentation don't run CI (macOS minutes are expensive).
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["docs/**", "**/*.md", "LICENSE", ".github/ISSUE_TEMPLATE/**"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md", "LICENSE", ".github/ISSUE_TEMPLATE/**"]

# a newer push to the same branch cancels a run still in progress
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: ruff check gp2sm tests

  test:
    strategy:
      fail-fast: false
      matrix:
        # full matrix on a version tag, slim otherwise
        include: >-
          ${{ fromJSON(startsWith(github.ref, 'refs/tags/v') && '[
          {"os": "ubuntu-latest", "python": "3.11"}, {"os": "ubuntu-latest", "python": "3.12"},
          {"os": "ubuntu-latest", "python": "3.14"},
          {"os": "windows-latest", "python": "3.11"}, {"os": "windows-latest", "python": "3.12"},
          {"os": "windows-latest", "python": "3.14"}]' || '[
          {"os": "ubuntu-latest", "python": "3.11"}, {"os": "ubuntu-latest", "python": "3.14"},
          {"os": "windows-latest", "python": "3.11"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: gp2sm --version

  package:
    # build the wheel and use it from a clean environment, as a user would install it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - run: python -m venv /tmp/clean && /tmp/clean/bin/pip install dist/*.whl
      - run: |
          cd /tmp
          /tmp/clean/bin/gp2sm --version
          /tmp/clean/bin/gp2sm --help
          /tmp/clean/bin/gp2sm init /tmp/demo --non-interactive --name demo --timezone UTC
          test -f /tmp/demo/gp2sm.toml
          /tmp/clean/bin/gp2sm services
